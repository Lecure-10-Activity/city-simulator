<!DOCTYPE html>
<html>
<head>
    <title>Debug City Simulator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px; margin: 5px; }
        #log { background: #f0f0f0; padding: 10px; height: 300px; overflow-y: scroll; }
    </style>
</head>
<body>
    <h1>City Simulator Debug</h1>
    <button onclick="testSimulateYear()">Test Simulate Year</button>
    <button onclick="testToggleSimulation()">Test Toggle Simulation</button>
    <button onclick="clearLog()">Clear Log</button>
    
    <h2>Console Log:</h2>
    <div id="log"></div>
    
    <script>
        // Capture console.log
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += args.join(' ') + '<br>';
            logDiv.scrollTop = logDiv.scrollHeight;
        };
        
        // Capture console.error
        const originalError = console.error;
        console.error = function(...args) {
            originalError.apply(console, args);
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += '<span style="color: red;">ERROR: ' + args.join(' ') + '</span><br>';
            logDiv.scrollTop = logDiv.scrollHeight;
        };
        
        function testSimulateYear() {
            console.log('Testing simulate year button...');
            if (window.citySimulator && window.citySimulator.city) {
                window.citySimulator.city.simulateYear();
                console.log('Simulate year called successfully');
            } else {
                console.error('City simulator not found');
            }
        }
        
        function testToggleSimulation() {
            console.log('Testing toggle simulation button...');
            if (window.citySimulator && window.citySimulator.city) {
                window.citySimulator.city.toggleSimulation();
                console.log('Toggle simulation called successfully');
            } else {
                console.error('City simulator not found');
            }
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
    </script>
    
    <!-- Load the city simulator -->
    <script src="js/city.js"></script>
    <script src="js/transportation.js"></script>
    <script src="js/power.js"></script>
    <script src="js/economy.js"></script>
    <script src="js/crime.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
